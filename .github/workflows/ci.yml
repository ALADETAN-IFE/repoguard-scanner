name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  repoguard-security-scan:
    name: RepoGuard Pre-Execution Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run RepoGuard Security Check
        uses: ALADETAN-IFE/repoguard-action@1f5947a155f654749155b712564e6cb0c45e63d7 # v1
        with:
          minimum-severity: medium
          fail-on: high
  test:
    needs: [repoguard-security-scan]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci
        
      - name: Run linter
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts